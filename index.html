<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打造你自己的技能庫：互動學習（Build Your Own Skill Library）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  --ink:#14232B;--soft:#4A5560;--muted:#6B7580;--line:#D6DCDF;--bg:#F7F5F0;--card:#FFFFFF;
  --teal:#0F5C63;--teal-l:#E3F0F0;--amber:#A85F08;--amber-l:#FBF1E2;--red:#A33A2C;--red-l:#F8E8E5;--green:#2E6B3A;--green-l:#E5F2E7;
  --mono:'JetBrains Mono','Noto Sans TC',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:16px;line-height:1.7}
button{font:inherit;cursor:pointer}
code{font-family:var(--mono);background:#EEF1F0;padding:1px 5px;border-radius:4px;font-size:.9em}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
nav{background:var(--ink);color:#E9EEEC;padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:19px;line-height:1.35;margin:0 0 4px;color:#fff}
nav .sub{font-size:12.5px;color:#9FB6B3;margin-bottom:18px}
.prog{background:#26404A;border-radius:99px;height:8px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:#E2A74E;width:0;transition:width .4s}
.progtxt{font-size:12.5px;color:#BFD8D5;margin-bottom:16px}
nav ol{list-style:none;padding:0;margin:0}
nav li button{width:100%;text-align:left;background:none;border:0;color:#D7E2E0;padding:9px 10px;border-radius:8px;display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.4}
nav li button:hover{background:#1F3640}
nav li button.on{background:var(--teal);color:#fff}
nav li .n{font-family:var(--mono);font-weight:700;color:#E2A74E;min-width:22px}
nav li .ok{margin-left:auto;color:#8FD19E;font-weight:700}
.mobilenav{display:none}
main{padding:40px 56px 80px;max-width:1080px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--teal)}
h2{font-size:34px;line-height:1.25;margin:6px 0 6px;font-weight:900}
.lead{color:var(--soft);font-size:17px;margin:0 0 24px}
h3{font-size:21px;margin:34px 0 10px;padding-left:12px;border-left:5px solid var(--amber)}
p{margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:14px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tip{background:var(--amber-l);border:1px solid #EBD3AA;border-radius:12px;padding:14px 18px;margin:14px 0}
.tip b.t{color:var(--amber)}
.warn{background:var(--red-l);border:1px solid #E5C0B9;border-radius:12px;padding:14px 18px;margin:14px 0}
.goal{background:var(--teal-l);border:1px solid #B9D8D9;border-radius:12px;padding:14px 18px;margin:0 0 18px}
.goal b{color:var(--teal)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin:12px 0;font-size:15px}
th{background:var(--ink);color:#fff;text-align:left;padding:10px 14px;font-weight:700}
td{padding:9px 14px;border-top:1px solid var(--line);vertical-align:top}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700}
.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
.btn.sm{padding:6px 12px;font-size:14px}
textarea,input[type=text]{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
textarea:focus,input:focus{outline:2px solid var(--teal);border-color:var(--teal)}
textarea{min-height:96px;resize:vertical}
label.f{display:block;font-weight:700;margin:14px 0 6px}
label.f small{font-weight:400;color:var(--muted)}
pre{font-family:var(--mono);font-size:13.5px;line-height:1.6;background:#fff;border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:10px;padding:14px 16px;white-space:pre-wrap;margin:10px 0;overflow:auto}
.pager{display:flex;justify-content:space-between;margin-top:44px;padding-top:20px;border-top:1px solid var(--line)}
.flip{perspective:900px;cursor:pointer;min-height:150px}
.flip .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;display:flex;flex-direction:column;justify-content:center}
.flip .fa{background:#fff;border:1px solid var(--line)}
.flip .fa .h{font-size:20px;font-weight:900}
.flip .fa .s{font-size:13px;color:var(--muted)}
.flip .fb{background:var(--teal);color:#fff;transform:rotateY(180deg);font-size:15px}
/* layers diagram */
.arch{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.arch .core{grid-column:1/3;background:var(--ink);color:#fff;border-radius:14px;padding:12px;text-align:center;font-weight:700;cursor:pointer}
.arch .loop{border:3px solid var(--teal);border-radius:14px;padding:14px;background:#fff}
.arch .loop.ex{border-color:var(--amber)}
.arch .loop h4{margin:0 0 8px;color:var(--teal)}
.arch .loop.ex h4{color:var(--amber)}
.lyr{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#F7F8F8;border:1.5px solid transparent;border-radius:10px;padding:9px 12px;margin:6px 0}
.lyr:hover,.lyr.on{border-color:var(--teal);background:var(--teal-l)}
.lyr b{font-family:var(--mono);color:var(--muted)}
.arch .guard{grid-column:1/3;background:var(--red-l);border:3px solid var(--red);border-radius:14px;padding:10px 14px;cursor:pointer}
.detail{background:#fff;border:2px solid var(--teal);border-radius:14px;padding:18px 20px;margin-top:14px;min-height:120px}
/* checker */
.chk{list-style:none;padding:0;margin:10px 0}
.chk li{padding:6px 0;display:flex;gap:10px;align-items:flex-start}
.chk .ic{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex:none;margin-top:2px}
.ic.y{background:var(--green);color:#fff}.ic.n{background:#E3E6E8;color:var(--muted)}
.score{font-size:40px;font-weight:900;color:var(--teal);line-height:1}
/* sort game */
.sortitem{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;flex-wrap:wrap}
.sortitem .opts{display:flex;gap:6px;flex-wrap:wrap}
.sortitem .opts button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:14px}
.sortitem.right{border-color:var(--green);background:var(--green-l)}
.sortitem.wrong{border-color:var(--red);background:var(--red-l)}
.sortitem .fb{width:100%;font-size:13.5px;color:var(--soft)}
/* quiz */
.quiz{background:#fff;border:2px dashed var(--teal);border-radius:14px;padding:18px 22px;margin-top:30px}
.quiz h4{margin:0 0 8px;color:var(--teal);font-size:18px}
.q{margin:14px 0 18px}
.q .qt{font-weight:700;margin-bottom:6px}
.q button.o{display:block;width:100%;text-align:left;background:#F7F8F8;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:15px}
.q button.o:hover{border-color:var(--teal)}
.q button.o.right{background:var(--green-l);border-color:var(--green)}
.q button.o.wrong{background:var(--red-l);border-color:var(--red)}
.q .ex{font-size:14px;color:var(--soft);margin-top:4px;display:none}
.q.done .ex{display:block}
.qres{font-weight:700;margin-top:6px}
/* code annot */
.annot .ln{display:flex;gap:10px;font-family:var(--mono);font-size:13.5px;line-height:1.75;padding:0 8px;border-radius:6px;cursor:pointer;white-space:pre-wrap}
.annot .ln:hover{background:#F2F4F4}
.annot .ln .tg{flex:none;width:30px;text-align:center;font-weight:700;border-radius:5px;font-size:11.5px;align-self:center}
.annot .ln.hi{background:var(--amber-l)}
.annot{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 6px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.legend button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;font-size:13.5px}
.legend button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.trace{display:flex;flex-direction:column;gap:8px}
.trace .st{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;opacity:.28;transition:opacity .3s}
.trace .st.on{opacity:1}
.trace .st.cur{border:2px solid var(--amber);box-shadow:0 2px 10px rgba(168,95,8,.15)}
.trace .st .num{font-family:var(--mono);font-weight:700;color:var(--teal);width:20px}
.trace .st .lay{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}
.bar{height:26px;border-radius:6px;transition:width .3s}
.range{width:100%}
.out{font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-left:5px solid var(--amber);border-radius:10px;padding:14px;min-height:300px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.err{color:var(--red);font-size:13.5px;margin-top:4px}
.okm{color:var(--green);font-size:13.5px;margin-top:4px}
.days li{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:10px;margin:6px 0}
.days{padding:0}
.days input{margin-top:6px;width:18px;height:18px;accent-color:var(--teal)}
.days .d{font-family:var(--mono);font-weight:700;color:var(--teal);min-width:40px}
.days .o{margin-left:auto;color:var(--muted);font-size:13.5px}
.match{margin:8px 0;padding:10px 14px;border-radius:10px;background:#fff;border:1.5px solid var(--line)}
.match.hit{border-color:var(--green);background:var(--green-l)}
.match.ex{border-color:var(--red);background:var(--red-l)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.gl{border-bottom:1.5px dotted var(--amber);cursor:help;position:relative}
.gl:hover::after,.gl:focus::after{content:attr(data-tip);position:absolute;left:0;top:100%;z-index:30;background:var(--ink);color:#fff;padding:8px 10px;border-radius:8px;width:max-content;max-width:260px;font-size:13px;line-height:1.5;font-weight:400;white-space:normal;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.drawer{position:fixed;inset:0;background:rgba(20,35,43,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.drawer.on{display:flex}
.drawer .box{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:22px 26px}
.glbtn{width:100%;margin:0 0 12px;background:#26404A;color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:14px}
.acc{border:2px solid var(--amber);background:var(--amber-l);border-radius:14px;padding:16px 20px;margin:24px 0}
.acc h4{margin:0 0 4px;color:var(--amber);font-size:18px}
.chip{display:inline-block;margin:3px 4px 3px 0;padding:3px 10px;border:1.5px solid var(--line);border-radius:99px;background:#fff;font-size:13.5px}
.chip:hover{border-color:var(--teal)}
.q button.o:disabled{opacity:.55;cursor:not-allowed}
.q button.o.sel{border-color:var(--teal);background:var(--teal-l)}
.q .hint{display:none;font-size:14px;color:var(--amber);margin-top:4px}
.q.tried .hint{display:block}
.nofb .q.done .ex{display:none}
details.pt{background:#fff;border:2px solid var(--teal);border-radius:14px;padding:12px 18px;margin:0 0 18px}
details.pt summary{cursor:pointer}
.rec td:first-child{width:36%}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav{display:none}
  .mobilenav{display:block;position:sticky;top:0;z-index:5;background:var(--ink);padding:10px 14px}
  .mobilenav select{width:100%;font:inherit;padding:8px;border-radius:8px}
  main{padding:24px 18px 60px}
  .grid2,.grid3,.grid4,.form2,.arch{grid-template-columns:1fr}
  .arch .core,.arch .guard{grid-column:auto}
  h2{font-size:27px}
}
</style>
</head>
<body>
<div class="mobilenav"><select id="msel" aria-label="選擇單元"></select><button class="glbtn" data-gloss style="margin:8px 0 0">術語表</button></div>
<div class="app">
<nav aria-label="課程單元">
  <h1>打造你自己的<br>技能庫</h1>
  <div class="sub">互動式學習網頁 · Build Your Own Skill Library</div>
  <div class="prog"><i id="progbar"></i></div>
  <div class="progtxt" id="progtxt">完成 0 / 10 個單元測驗</div>
  <div class="progtxt" id="progtxt2"></div>
  <button class="glbtn" data-gloss>術語表</button>
  <ol id="navlist"></ol>
  <p style="font-size:12px;color:#8FA6A3;margin-top:18px">內容依據 @0xShoopy〈Build Your Own Skill Library〉英文原文與繁中譯本改寫。八層命名屬原作者觀點。</p>
</nav>
<main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div class="drawer" id="drawer"></div>

<script>
/* ====================== helpers ====================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MEM={};
function store(k,v){
 if(v!==undefined){MEM[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}return}
 try{const r=localStorage.getItem(k);if(r!==null)return JSON.parse(r)}catch(e){}
 return k in MEM?MEM[k]:null;
}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
let done=store("skl-done")||{};
let curU="";
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---- glossary: PDF Appendix G + a few supplements ---- */
const G={
"技能庫":"代理能發現的每個技能資料夾的總和；啟動時只索引前置中繼資料（PDF 第 IV 節）",
"技能":"含有 SKILL.md、封裝一套程序的資料夾（PDF 附錄 G）",
"前置中繼資料":"Frontmatter：代理總是能看到的 name 與 description（PDF 附錄 G）",
"漸進式揭露":"先載入中繼資料，再載入指令，最後載入資源；只在需要時載入（PDF 附錄 G）",
"觸發":"代理根據描述判斷某個技能適用（PDF 附錄 G）",
"專案檔":"CLAUDE.md、AGENTS.md 或類似檔案，每個工作階段都會讀取（PDF 附錄 G「專案檔案」）",
"子代理":"Subagent：擁有獨立情境與工具的工作者（PDF 附錄 G）",
"MCP":"將代理連接到外部工具與資料的協定（PDF 附錄 G）",
"重播測試":"重新執行固定輸入，以找出回歸問題（PDF 附錄 G）",
"防護":"技能中的「可自行執行／先詢問／絕不執行」清單（PDF 附錄 G）",
"修正輪次":"修復未通過檢查的一輪作業；最多兩輪（PDF 附錄 G）",
"變更紀錄":"SKILL.md 結尾帶有日期、記錄變更的條目（PDF 附錄 G）",
"斷言":"（本網頁補充）程式裡的自動核對：條件不成立就報錯停止，例如「輸入筆數＝輸出筆數」",
"linter":"（本網頁補充）自動檢查程式碼風格與常見錯誤的工具",
"JSON":"（本網頁補充）程式之間交換資料的純文字格式",
"CSV":"（本網頁補充）以逗號分隔欄位的表格純文字檔，可用試算表開啟"};
const GTIP=["前置中繼資料","漸進式揭露","子代理","MCP","重播測試","修正輪次","變更紀錄","斷言","linter","JSON","CSV"];
function annotate(){
 const skip="h1,h2,h3,h4,code,pre,textarea,button,input,select,.quiz,.eyebrow,.annot,.out,.pt,.gl,.drawer,.sortitem";
 GTIP.forEach(term=>{
  const w=document.createTreeWalker($("#main"),NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){
   if(n.parentElement.closest(skip))continue;
   const i=n.nodeValue.indexOf(term);if(i<0)continue;
   const r=n.splitText(i);r.splitText(term.length);
   const sp=document.createElement("span");sp.className="gl";sp.tabIndex=0;sp.dataset.tip=G[term];
   r.parentNode.replaceChild(sp,r);sp.appendChild(r);break;
  }
 });
}
function openGloss(){
 const d=$("#drawer");
 d.innerHTML=`<div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3 style="margin:0;border:0;padding:0">術語表</h3><button class="btn sm ghost" id="gclose">關閉</button></div><p style="font-size:13.5px;color:var(--muted)">依 PDF 附錄 G；標示「本網頁補充」者不在原文中。</p><table><tr><th>術語</th><th>意義</th></tr>${Object.entries(G).map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td>${esc(v)}</td></tr>`).join("")}</table></div>`;
 d.classList.add("on");$("#gclose").onclick=()=>d.classList.remove("on");d.onclick=e=>{if(e.target===d)d.classList.remove("on")};
}

/* ---- cumulative task: fields saved to the same store the Unit 7 generator reads ---- */
function accTask(sel,o){
 const root=$(sel);const g=()=>store("skl-gen")||{};
 root.innerHTML=`<div class="acc"><h4>${o.title}</h4><p style="font-size:14.5px">${o.intro}</p>${o.fields.map(f=>`<label class="f">${f.label} <small>${f.hint||""}</small></label>${f.ta?`<textarea id="a_${f.id}" placeholder="${esc(f.ph||"")}"></textarea>`:`<input type="text" id="a_${f.id}" placeholder="${esc(f.ph||"")}">`}`).join("")}<div id="a_note" style="margin-top:8px"></div></div>`;
 o.fields.forEach(f=>{const e=$("#a_"+f.id);e.value=g()[f.id]||"";e.oninput=()=>{const x=g();x[f.id]=e.value;store("skl-gen",x);if(o.onchange)o.onchange(x)}});
 if(o.onchange)o.onchange(g());
}

/* ---- pre/post test (same 8 items, options reshuffled each time) ---- */
const PT=[
{q:"下列哪一項屬於「事實」，應放在專案檔而不是技能？",o:["每次寫版本說明的固定流程","技術堆疊與檔案路徑","審查合約的逐條步驟","週報的 5 步產出程序"],a:1,e:"對所有任務都成立的是事實，放專案檔；描述「如何做某一類任務」的才是技能。"},
{q:"漸進式揭露的載入順序是？",o:["中繼資料 → 指令 → 資源","資源 → 指令 → 中繼資料","指令 → 中繼資料 → 資源","三者一開始就全部載入"],a:0,e:"先載入中繼資料，再載入指令，最後載入資源；只在需要時載入。"},
{q:"技能的描述只寫「協助寫作」，最可能發生什麼事？",o:["每次請求都被載入","技能執行得更快","從不被載入","自動拆成兩個技能"],a:2,e:"太空泛的標籤無法比對任何請求；過寬則是什麼請求都載入。"},

  if(feedback&&pre)msg+=`　前測 ${sum(pre)} → 後測 ${sum(r)}（${r.r-pre.r>=0?"+":""}${r.r-pre.r} 題）`;
  if(!feedback)msg+=" 答案不顯示，學完後在單元 9 用同一組題目的後測比較。";
  return msg}
 function draw(){
  const ord=PT.map(q=>shuf(q.o.map((_,j)=>j)));let ans=0,right=0;
  root.className=feedback?"":"nofb";
  root.innerHTML=PT.map((q,i)=>`<div class="q" data-q="${i}"><div class="qt">${i+1}. ${q.q}</div>${ord[i].map((j,k)=>`<button class="o" data-o="${j}">${String.fromCharCode(65+k)}. ${q.o[j]}</button>`).join("")}<div class="ex">${q.e}</div></div>`).join("")+`<div class="qres" id="${sel.slice(1)}_res"></div>`;
  root.querySelectorAll(".q").forEach(qe=>{const q=PT[qe.dataset.q];qe.querySelectorAll(".o").forEach(b=>b.onclick=()=>{
   if(qe.classList.contains("done"))return;qe.classList.add("done");ans++;const ok=+b.dataset.o===q.a;if(ok)right++;
   if(feedback){b.classList.add(ok?"right":"wrong");if(!ok)qe.querySelector(`[data-o="${q.a}"]`).classList.add("right")}else b.classList.add("sel");
   if(ans===PT.length){const r={r:right,n:PT.length,t:new Date().toISOString().slice(0,10)};store(key,r);$("#"+sel.slice(1)+"_res").innerHTML=afterSave(r);if($("#rec"))recPanel()}
  })});
 }
 if(prev){root.className="";root.innerHTML=`<div class="qres">${afterSave(prev)}</div>`+(feedback?`<button class="btn ghost sm" id="${sel.slice(1)}_redo" style="margin-top:8px">重做後測</button>`:"");if(feedback)$("#"+sel.slice(1)+"_redo").onclick=draw}

}

<div class="eyebrow">UNIT 4 · 原文第 IV–VII 節</div><h2>路由迴圈：技能庫、觸發、程序、資源</h2>
<p class="lead">這是寫技能最常出錯、也最重要的部分。</p>
<div class="goal"><b>本單元目標：</b>能把一句含糊的描述，改寫成含輸出、輸入、3 個語句、1 個排除條件的描述。</div>

<h3>01 技能庫：事實放專案檔，程序放技能</h3>
<p>如果某一行對所有任務都成立 → 專案檔；如果它描述「如何執行某一類任務」→ 技能。試著分類：</p>
<div id="factproc"></div>

<h3>01 技能庫：三個範圍（PDF 表 V）</h3>
<p>技能可以放在三種範圍。原則：把每個技能放在仍能涵蓋所有需求場景的<b>最小</b>範圍。</p>
<table><tr><th>範圍</th><th>存放位置</th><th>跟隨對象</th><th>適合用途</th></tr>
<tr><td>個人</td><td>你的使用者資料夾</td><td>你</td><td>寫作風格、審查習慣</td></tr>
<tr><td>專案</td><td>儲存庫</td><td>團隊</td><td>發布流程、品牌語氣</td></tr>
<tr><td>外掛</td><td>已安裝的套件</td><td>工具</td><td>供應商提供的程序</td></tr></table>
<div id="scope"></div>
<h3>01 命名檢查器：動詞－名詞</h3>
<div class="card"><label class="f" for="nm">技能名稱</label><input type="text" id="nm" value="write-weekly-report"><div id="nmres"></div></div>

<h3>02 觸發：描述健檢器</h3>
<p>可供路由的描述要依序包含：<b>① 輸出</b>（做出什麼）、<b>② 輸入</b>（從哪裡）、<b>③ 三個使用者會說的語句</b>（用「」框起來）、<b>④ 一個排除條件</b>（不適用於…）。</p>
<div class="card">
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"><button class="btn ghost sm" data-ex="0">載入：薄弱範例</button><button class="btn ghost sm" data-ex="1">載入：有力範例</button><button class="btn ghost sm" data-ex="2">清空自己寫</button></div>
 <textarea id="desc"></textarea>
 <div class="grid2"><ul class="chk" id="dchk"></ul><div style="text-align:center;padding-top:10px"><div class="score" id="dscore">0/4</div><div id="dverdict" style="color:var(--soft)"></div></div></div>
 <p style="font-size:13px;color:var(--muted)">說明：這是依原文四部分結構做的格式檢查，用來練習；真正的 AI 是依語意判斷，不是比對關鍵字。</p>
</div>

<h3>02 觸發：路由模擬器</h3>
<p>技能庫裡有下列四個技能。輸入一句請求（不要說技能名稱），看看哪個技能會被觸發。試試「近似但不該適用」的請求，例如「幫我整理會議紀錄」。</p>
<div class="card">
 <input type="text" id="rq" value="幫我寫這週的進度報告">
 <div id="rres" style="margin-top:10px"></div>
 <p style="font-size:13px;color:var(--muted)">簡化示意：以描述中的語句與關鍵詞比對；真實模型會理解語意，但「語句寫得越像使用者會說的話，越容易命中」這個原則相同。</p>
</div>

<h3>03 程序：可觀察的步驟 vs 容易偏離的步驟</h3>
<p>每個步驟都應是「你看得見它確實發生」的動作。判斷下列步驟：</p>
<div id="verbs"></div>
<div class="tip"><b class="t">程序三原則：</b>① 第 1 步一定是「查看」，並加上「凡是能在其中找到的資訊，都不要再詢問」；② 每步都用命令句、可觀察；③ 以檢查收尾，最多修正 2 輪，並寫好分支（「若缺少輸入，詢問一次後停止」）。</div>

<h3>04 資源：只深入一層</h3>
<table><tr><th>資料夾</th><th>存放內容</th><th>載入時機</th></tr>
<tr><td><code>references/</code></td><td>指南、政策、API 說明</td><td>某個步驟指向它時</td></tr>

 $("#golive").innerHTML=GL.map((g,i)=>`<li><input type="checkbox" id="gg${i}" ${gs[i]?'checked':''}><label for="gg${i}" style="display:flex;gap:10px;flex:1;cursor:pointer"><span class="d">${i+1}</span><span>${g}</span></label></li>`).join("");
 function cnt(){const a=[...document.querySelectorAll("#days input")].map(c=>c.checked);const b=[...document.querySelectorAll("#golive input")].map(c=>c.checked);store(dk,a);store(gk,b);$("#dcount").textContent=a.filter(Boolean).length+" / 10 天";$("#gcount").textContent=b.filter(Boolean).length+" / 12 格"}
 document.querySelectorAll("#days input,#golive input").forEach(c=>c.onchange=cnt);cnt();
 $("#dsg").textContent=DESIGNER;
 $("#cpd").onclick=async()=>{try{await navigator.clipboard.writeText(DESIGNER);toast("已複製提示詞")}catch(e){const r=document.createRange();r.selectNodeContents($("#dsg"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("請按 Ctrl/⌘＋C 複製已選取的內容")}};
 runTest("#post","skl-post",true);recPanel();libPanel();
}});

/* ====================== generic sort game ====================== */
function sortGame(sel,items,cats){
 const root=$(sel);let right=0,answered=0;
 root.innerHTML=items.map((it,i)=>`<div class="sortitem" data-i="${i}"><span>${esc(it.t)}</span><div class="opts">${cats.map(c=>`<button data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div><div class="fb"></div></div>`).join("")+`<div class="qres" id="${sel.slice(1)}_r"></div>`;
 root.querySelectorAll(".sortitem").forEach(el=>{const it=items[el.dataset.i];el.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(el.dataset.done)return;el.dataset.done=1;answered++;const ok=b.dataset.c===it.a;if(ok)right++;el.classList.add(ok?"right":"wrong");b.style.fontWeight="700";
  el.querySelector(".fb").innerHTML=(ok?"✓ 正確":"✕ 正確答案："+esc(it.a))+(it.f?"　"+esc(it.f):"");
  if(answered===items.length){$(sel+"_r").textContent=`答對 ${right} / ${items.length}`+(right===items.length?"，全對！":"");const sg=store("skl-sg")||{};sg[curU+sel]={r:right,n:items.length};store("skl-sg",sg);renderNav(curU)}})});
}

/* ====================== router / render ====================== */
function renderNav(cur){
 $("#navlist").innerHTML=U.map((u,i)=>`<li><button class="${u.id===cur?'on':''}" data-go="${u.id}"><span class="n">${i}</span><span>${u.title}</span>${done[u.id]?'<span class="ok">✓</span>':''}</button></li>`).join("");
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{location.hash=b.dataset.go});
 $("#msel").innerHTML=U.map((u,i)=>`<option value="${u.id}" ${u.id===cur?'selected':''}>單元 ${i}：${u.title}${done[u.id]?' ✓':''}</option>`).join("");
 const n=Object.keys(done).filter(k=>done[k]).length;$("#progbar").style.width=(n/U.length*100)+"%";$("#progtxt").textContent=`完成 ${n} / ${U.length} 個單元測驗`;
 const sgn=Object.keys(store("skl-sg")||{}).length;$("#progtxt2").textContent=`分類練習 ${sgn} / 8 組 · 我的技能庫 ${libList().length} / 3 個技能`;
}
function renderQuiz(u){
 const qs=u.quiz;u._ord=qs.map(q=>shuf(q.o.map((_,j)=>j)));
 let html=`<div class="quiz"><h4>小測驗：單元 ${U.indexOf(u)} 自我檢核</h4><p style="font-size:14px;color:var(--muted)">第一次作答全對，才標記本單元完成。答錯可以再選一次；第二次仍錯才顯示答案。按「重新作答」會重新排列選項。</p>`;
 qs.forEach((q,i)=>{html+=`<div class="q" data-q="${i}"><div class="qt">${i+1}. ${q.q}</div>${u._ord[i].map((j,k)=>`<button class="o" data-o="${j}">${String.fromCharCode(65+k)}. ${q.o[j]}</button>`).join("")}<div class="hint">再想想：換一個選項試試。</div><div class="ex">${q.e}</div></div>`});
 html+=`<div class="qres" id="qres"></div><button class="btn ghost sm" id="qretry" style="display:none;margin-top:8px">重新作答</button></div>`;return html;
}
function bindQuiz(u){
 let right=0,fin=0;const qs=u.quiz,N=qs.length;
 function finish(){
  const all=right===N;store("skl-q-"+u.id,{r:right,n:N});
  $("#qres").innerHTML=all?'<span style="color:var(--green)">全部第一次答對，本單元完成！</span>':`<span style="color:var(--amber)">第一次答對 ${right} / ${N}。看完解說後可以重新作答（選項會重新排列）。</span>`;
  if(all){done[u.id]=true;store("skl-done",done);renderNav(u.id)}else $("#qretry").style.display="inline-block";
 }
 document.querySelectorAll(".quiz .q").forEach(qe=>{const q=qs[qe.dataset.q];let tries=0;
  qe.querySelectorAll(".o").forEach(b=>b.onclick=()=>{
   if(qe.classList.contains("done")||b.disabled)return;
   tries++;const j=+b.dataset.o;
   if(j===q.a){b.classList.add("right");if(tries===1)right++;fin++;qe.classList.remove("tried");qe.classList.add("done")}
   else{b.classList.add("wrong");b.disabled=true;
    if(tries>=2){qe.querySelector(`[data-o="${q.a}"]`).classList.add("right");fin++;qe.classList.remove("tried");qe.classList.add("done")}
    else qe.classList.add("tried")}
   if(fin===N)finish();
  })});
 const rt=$("#qretry");if(rt)rt.onclick=()=>show(u.id,true);
}
function show(id,keepScroll){
 const u=U.find(x=>x.id===id)||U[0];const i=U.indexOf(u);
 $("#main").innerHTML=u.html+renderQuiz(u)+`<div class="pager">${i>0?`<button class="btn ghost" data-go2="${U[i-1].id}">← 單元 ${i-1}</button>`:'<span></span>'}${i<U.length-1?`<button class="btn" data-go2="${U[i+1].id}">單元 ${i+1}：${U[i+1].title} →</button>`:'<span style="font-weight:700;color:var(--teal)">課程結束，去寫你的第一個技能吧！</span>'}</div>`;
 document.querySelectorAll("[data-go2]").forEach(b=>b.onclick=()=>{location.hash=b.dataset.go2});
 curU=u.id;u.init();bindQuiz(u);renderNav(u.id);annotate();if(!keepScroll)window.scrollTo(0,0);
}
$("#msel").onchange=e=>{location.hash=e.target.value};
document.querySelectorAll("[data-gloss]").forEach(b=>b.onclick=openGloss);
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||"u0");
</script>
